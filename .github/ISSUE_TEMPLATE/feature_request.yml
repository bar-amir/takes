name: Feature request
description: An idea that would make Takes better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This idea doesn't need Takes to send data anywhere new (or I've explained why it's worth it).
