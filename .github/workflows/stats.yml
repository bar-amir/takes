# Once a day, saves download, update-check and traffic numbers to CSV files on the `stats` branch.
# GitHub only keeps running totals and 14 days of traffic, so this keeps the history.
# Optional secret TRAFFIC_TOKEN: a fine-grained token for this repository only, with
# "Administration: Read-only". Without it, views, clones and referrers are skipped.
name: Stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write        # push to the stats branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the stats branch
        run: |
          if git ls-remote --exit-code --heads origin stats >/dev/null; then
            git fetch --depth 1 origin stats
            git worktree add stats-data FETCH_HEAD
          else
            git worktree add --orphan -b stats stats-data
          fi
      - name: Snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python3 scripts/stats.py stats-data
      - name: Commit
        working-directory: stats-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Stats for $(date -u +%F)"
          git push origin HEAD:stats
