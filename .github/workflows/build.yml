# Builds the app and runs the unit tests on every pull request and push to main.
# main requires this check ("build") to pass before a pull request can merge.
name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
