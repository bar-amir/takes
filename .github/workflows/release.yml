# Publishes a signed, notarized release when a version tag (v1.2.3) is pushed.
#
#   1. Bump VERSION and add a "## <version>" section to CHANGELOG.md in a pull request; merge it.
#   2. Tag the merge commit and push the tag:  git tag v0.1.0 && git push origin v0.1.0
#   3. The run pauses for approval in the protected "release" environment. Only after Bar approves
#      can it read the signing secrets.
#   4. It builds, signs (Developer ID), notarizes (App Store Connect API key), signs the update
#      (Sparkle EdDSA), attests build provenance, and publishes the GitHub Release with the .dmg,
#      checksum and appcast.xml (the update feed Takes reads).
#
# Hardening: third-party actions pinned to full commit SHAs, minimal token permissions, no caches,
# secrets only in the "release" environment, a throwaway keychain deleted at the end.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write        # create the release
      id-token: write        # build provenance attestation
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # build number = commit count
          persist-credentials: false

      - name: Check the tag matches VERSION and the release notes exist
        run: |
          VERSION=$(cat VERSION)
          [[ "$TAG" == "v$VERSION" ]] || { echo "Tag $TAG doesn't match VERSION ($VERSION)."; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG isn't on main."; exit 1; }
          scripts/release-notes.sh "$VERSION" > /dev/null

      - name: Set up signing (throwaway keychain)
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          SIGN_ID=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          [[ -n "$SIGN_ID" ]] || { echo "The Developer ID certificate didn't import."; exit 1; }
          echo "SIGN_ID=$SIGN_ID" >> "$GITHUB_ENV"

          umask 077
          echo "$NOTARY_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-key"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"
          echo "SPARKLE_KEY_FILE=$RUNNER_TEMP/sparkle-key" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: scripts/release.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Takes-*.dmg

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION)
          # Draft first, attach every file, then publish (works with immutable releases).
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Takes $VERSION" --notes-file dist/release-notes.md
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            "dist/Takes-$VERSION.dmg" "dist/Takes-$VERSION.dmg.sha256" dist/appcast.xml
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/sparkle-key" "$RUNNER_TEMP/developer-id.p12"
